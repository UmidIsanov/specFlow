# Позиция — nginx. Положить в /etc/nginx/sites-available/pozitsiya, включить симлинком в sites-enabled.
# Сертификат ставится командой: certbot --nginx -d pozitsiya.uz -d www.pozitsiya.uz

server {
    listen 80;
    server_name pozitsiya.uz www.pozitsiya.uz;
    # certbot сам допишет сюда редирект на https
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name pozitsiya.uz www.pozitsiya.uz;

    ssl_certificate     /etc/letsencrypt/live/pozitsiya.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pozitsiya.uz/privkey.pem;

    # Пока в платформе нет своей авторизации, закрываем вход паролем:
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd oybek
    auth_basic           "Pozitsiya";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # сканы бывают по 20–30 МБ
    client_max_body_size 64m;

    # распознавание идёт минутами — не рвём соединение
    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    proxy_connect_timeout 30s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://127.0.0.1:4000;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}
